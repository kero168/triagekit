name: Feature request
description: Propose an improvement or new capability.
title: '[feature] '
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the maintainer/triage pain, not the solution, first.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like triagekit to do. CLI flags, Action inputs, output — sketches welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you looked at, including "do nothing".

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This keeps triagekit working with zero API keys by default (LLM strictly opt-in)
        - label: I searched existing issues and the roadmap for duplicates
