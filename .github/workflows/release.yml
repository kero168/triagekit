name: Release

# Publishes to npm via trusted publishing (OIDC) — no NPM_TOKEN secret needed.
# Configure the trusted publisher for the `triagekit` package on npmjs.com:
#   repository kero168/triagekit, workflow release.yml, environment (none).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm (trusted publishing needs a recent npm)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish
        run: npm publish
